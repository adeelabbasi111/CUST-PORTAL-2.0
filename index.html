<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUST Portal - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-grid"></div>
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="container fade-in">
        <h1 class="title">CUST Portal</h1>
        <p class="subtitle">Student Performance Dashboard</p>
        <p class="credit">🎓 Login to Access Your Records</p>

        <div class="login-form">
            <div class="input-group">
                <label for="regNo">Registration Number</label>
                <input type="text" id="regNo" placeholder="e.g., BAI251022" required>
            </div>
            <div class="input-group">
                <label for="cgpa">Current CGPA</label>
                <input type="number" id="cgpa" step="0.01" min="0" max="4" placeholder="e.g., 3.82" required>
            </div>
            <button class="btn primary" id="loginBtn" style="width: 100%; margin-top: 1rem;">
                🔐 Login
            </button>
            <p id="errorMsg" class="error-msg" style="display: none; color: #f87171; margin-top: 1rem;"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
